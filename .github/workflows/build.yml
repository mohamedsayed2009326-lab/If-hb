name: Build APK from ZIP
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(find . -name "*.zip" -not -path "./.git/*" | head -n1)
          echo "Found: $ZIP"
          unzip -q "$ZIP" -d app
          PKG=$(find app -name package.json -not -path "*/node_modules/*" | head -n1)
          echo "APP_DIR=$(dirname "$PKG")" >> $GITHUB_ENV

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install and build web
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Add Android and sync
        working-directory: ${{ env.APP_DIR }}
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: ${{ env.APP_DIR }}/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: plates-manager-android-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
