name: Build APK from ZIP
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q plates-android-manager-storage-workflow-fixed.zip -d app
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install and build web
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Add Android and sync
        working-directory: app
        run: |
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: app/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: plates-manager-android-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
